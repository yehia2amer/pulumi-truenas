[project]
name = "pulumi-truenas"
version = "0.1.0"
description = "Pulumi component library to manage TrueNAS apps, datasets, and directories."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Yehia Amer" }]
keywords = ["pulumi", "truenas", "iac", "infrastructure", "homelab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pulumi>=3.0,<4.0",
  "orjson>=3.10",
  "websocket-client>=1.8",
]

[project.urls]
Homepage = "https://github.com/yehia2amer/pulumi-truenas"
Issues = "https://github.com/yehia2amer/pulumi-truenas/issues"
Changelog = "https://github.com/yehia2amer/pulumi-truenas/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pyrefly>=0.30",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulumi_truenas"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PTH", "RUF", "TRY", "PERF"]
ignore = ["TRY003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = [".venv", "dist", "build"]
python-platform = "linux"
python-version = "3.12"
min-severity = "warn"
check-unannotated-defs = true
infer-return-types = "never"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
